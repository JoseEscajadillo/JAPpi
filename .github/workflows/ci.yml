name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      # Activa las pruebas de contrato de natsbus contra un NATS real.
      JAPPI_TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: NATS con JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: vet
        run: go vet ./...

      - name: test (incluye reglas hexagonales)
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build
        run: |
          for svc in control-plane github-integration; do
            go build -o bin/$svc ./services/$svc/cmd/$svc
          done
