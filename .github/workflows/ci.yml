name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (formato, vet, pruebas, vulnerabilidades)
    runs-on: ubuntu-latest
    env:
      # Activa las pruebas de contrato de natsbus contra un NATS real.
      JAPPI_TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: NATS con JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: vet
        run: go vet ./...

      - name: test (incluye reglas hexagonales)
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build de todos los servicios
        run: |
          for dir in services/*/cmd/*/; do
            go build -o bin/ "./$dir"
          done
          ls -la bin/

  kubernetes:
    name: deployer contra Kubernetes real (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: clúster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: jappi-ci

      - name: prueba de integración del deployer
        env:
          JAPPI_TEST_KUBECONFIG: /home/runner/.kube/config
        run: go test -count=1 -v -run Integration ./services/deployer/...

      - name: diagnóstico si falla
        if: failure()
        run: |
          kubectl get all,networkpolicies,resourcequotas -A -l app.kubernetes.io/managed-by=jappi || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true

  images:
    name: imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: |
          for dir in services/*/cmd/*/; do
            svc=$(basename "$dir")
            [ "$svc" = "jappi-detect" ] && continue
            echo "::group::$svc"
            docker build --build-arg SERVICE="$svc" -t "jappi-$svc:ci" .
            echo "::endgroup::"
          done
          docker images | grep jappi-
